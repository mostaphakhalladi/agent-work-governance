name: Agent Governance Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify repository agent policy
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          grep -F 'GLOBAL_WORK_POLICY:' AGENTS.md >/dev/null
          grep -Ei '8[^0-9]*12|12[^0-9]*minute|12 minutes' AGENTS.md >/dev/null
          echo "AGENT_GOVERNANCE_OK"
